<!-- src/main/resources/static/index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FAF6EC" />
    <meta name="color-scheme" content="light" />
    <title>GitStatus — Trending Repositories</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
    <style>
        /* ─────────────────────────────────────────────────
           MINIMAL YET WARM
           80% eggshell/cream · 15% taupe · 5% jelly-bean red
           ───────────────────────────────────────────────── */
        :root {
            --bg:            #FAF6EC;
            --bg-elevated:   #F4EBD6;
            --bg-card:       #FFFFFF;
            --bg-hover:      #F8F1DE;

            --border:        #E8DCC0;
            --border-strong: #D5C5A0;

            --text:          #3A3229;
            --text-muted:    #8B7E6E;
            --text-dim:      #A89B87;

            --accent:        #E63946;
            --accent-hover:  #C42E3A;
            --accent-tint:   #FBE8E8;

            --radius:        8px;
            --gap:           20px;
            --pad-x:         28px;

            --safe-top:    env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --safe-left:   env(safe-area-inset-left, 0px);
            --safe-right:  env(safe-area-inset-right, 0px);
        }

        * { box-sizing: border-box; }

        html {
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
        }

        html, body {
            margin: 0; padding: 0;
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont,
                         'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            font-size: 15px;
            line-height: 1.55;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            overflow-x: hidden;
        }

        /* Touch feedback — replaces blue flash on Android */
        button, a, select {
            -webkit-tap-highlight-color: rgba(230, 57, 70, 0.10);
        }
        .btn, .btn-ai, .btn-close { touch-action: manipulation; }

        .container {
            max-width: 1240px;
            margin: 0 auto;
            padding-left: calc(var(--pad-x) + var(--safe-left));
            padding-right: calc(var(--pad-x) + var(--safe-right));
        }

        /* ─── Header ─────────────────────────────────── */
        .app-header {
            background: var(--bg-card);
            border-bottom: 1px solid var(--border);
            position: sticky; top: 0; z-index: 10;
            padding-top: var(--safe-top);
        }
        .header-inner {
            display: flex; align-items: baseline; justify-content: space-between;
            padding-top: 22px; padding-bottom: 22px;
            gap: 16px; flex-wrap: wrap;
        }
        .brand {
            font-size: 24px; font-weight: 700; margin: 0;
            letter-spacing: -0.02em; color: var(--text);
        }
        .brand-mark { color: var(--accent); }
        .tagline {
            margin: 0; color: var(--text-muted);
            font-size: 14px; font-weight: 400;
        }

        /* ─── Controls ───────────────────────────────── */
        .controls {
            display: flex; gap: var(--gap); align-items: flex-end;
            padding: 32px 0 24px; flex-wrap: wrap;
        }
        .control-group { display: flex; flex-direction: column; gap: 8px; }
        .control-label {
            font-size: 11px; font-weight: 600; color: var(--text-muted);
            text-transform: uppercase; letter-spacing: 0.1em;
        }
        .select {
            background: var(--bg-card); color: var(--text);
            border: 1px solid var(--border-strong);
            border-radius: var(--radius);
            padding: 10px 36px 10px 14px;
            font-size: 15px; font-family: inherit; font-weight: 500;
            min-width: 180px; cursor: pointer; appearance: none;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path fill='%238B7E6E' d='M6 8L0 0h12z'/></svg>");
            background-repeat: no-repeat;
            background-position: calc(100% - 14px) 50%;
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }
        .select:hover { border-color: var(--text-muted); }
        .select:focus {
            outline: none; border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-tint);
        }

        .btn {
            border: 1px solid var(--border-strong);
            border-radius: var(--radius);
            padding: 10px 22px; font-size: 14px; font-weight: 600;
            font-family: inherit; cursor: pointer;
            background: var(--bg-card); color: var(--text);
            transition: all 0.15s ease;
        }
        .btn:hover:not(:disabled) { background: var(--bg-hover); border-color: var(--text-muted); }
        .btn:active:not(:disabled) { transform: translateY(1px); }
        .btn:focus-visible {
            outline: none; border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-tint);
        }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; }

        #refreshBtn {
            background: var(--accent); color: #ffffff;
            border-color: var(--accent);
        }
        #refreshBtn:hover:not(:disabled) {
            background: var(--accent-hover); border-color: var(--accent-hover);
        }

        /* ─── Meta + Status ──────────────────────────── */
        .meta {
            color: var(--text-muted); font-size: 13px;
            font-weight: 500; padding: 4px 0 20px;
        }
        .status {
            padding: 32px; text-align: center;
            border: 1px solid var(--border); border-radius: var(--radius);
            background: var(--bg-card); color: var(--text-muted);
            font-size: 14px;
        }
        .status.error {
            color: var(--accent-hover);
            border-color: var(--accent);
            background: var(--accent-tint);
        }

        /* ─── Grid ───────────────────────────────────── */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: var(--gap); padding-bottom: 40px;
        }

        /* ─── Card ───────────────────────────────────── */
        .card {
            display: flex; flex-direction: column; gap: 14px;
            background: var(--bg-card);
            border: 1px solid var(--border); border-radius: var(--radius);
            padding: 20px; position: relative;
            transition: all 0.2s ease;
            box-shadow: 0 1px 2px rgba(58, 50, 41, 0.04);
        }
        .card:hover {
            border-color: var(--border-strong);
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(58, 50, 41, 0.08);
        }

        .score-badge {
            position: absolute; top: 16px; right: 16px; z-index: 2;
            background: var(--accent); color: #ffffff;
            padding: 4px 12px; border-radius: 999px;
            font-size: 12px; font-weight: 700; letter-spacing: 0.02em;
            box-shadow: 0 2px 6px rgba(230, 57, 70, 0.28);
        }

        .card-head { display: flex; gap: 14px; align-items: flex-start; }
        .avatar {
            width: 44px; height: 44px; border-radius: 8px;
            flex-shrink: 0; background: var(--bg-elevated);
            border: 1px solid var(--border);
        }
        .card-title-block { min-width: 0; flex: 1; padding-right: 72px; }
        .card-title {
            margin: 0; font-size: 16px; font-weight: 600;
            letter-spacing: -0.01em; line-height: 1.3;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .card-title a { color: var(--text); text-decoration: none; transition: color 0.15s ease; }
        .card-title a:hover { color: var(--accent); }
        .card-owner {
            color: var(--text-muted); font-size: 13px;
            margin: 4px 0 0; font-weight: 400;
        }

        .card-desc {
            color: var(--text-muted); font-size: 14px; margin: 0;
            line-height: 1.55;
            display: -webkit-box; -webkit-line-clamp: 3;
            -webkit-box-orient: vertical; overflow: hidden;
            min-height: 4.1em;
        }

        .badge {
            display: inline-block; padding: 4px 11px; border-radius: 999px;
            font-size: 11px; font-weight: 600;
            background: var(--bg-elevated); color: var(--text-muted);
            border: 1px solid var(--border); letter-spacing: 0.02em;
        }
        .badge.category { color: var(--text); border-color: var(--border-strong); }

        .card-stats {
            display: flex; gap: 18px; flex-wrap: wrap;
            font-size: 12px; color: var(--text-muted); padding-top: 2px;
        }
        .stat { display: flex; align-items: center; gap: 5px; }
        .stat > span:first-child { color: var(--text-dim); font-size: 13px; }
        .stat-value {
            color: var(--text); font-weight: 600;
            font-variant-numeric: tabular-nums;
        }

        .card-foot {
            display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
            border-top: 1px solid var(--border);
            padding-top: 14px; margin-top: auto;
        }

        .btn-ai {
            margin-left: auto;
            padding: 6px 14px;
            font-size: 12px;
            font-weight: 600;
            background: transparent;
            color: var(--accent);
            border: 1px solid var(--accent);
            border-radius: var(--radius);
            transition: all 0.15s ease;
        }
        .btn-ai:hover:not(:disabled) {
            background: var(--accent);
            color: #ffffff;
            box-shadow: 0 2px 6px rgba(230, 57, 70, 0.28);
        }
        .btn-ai:focus-visible {
            outline: none;
            box-shadow: 0 0 0 3px var(--accent-tint);
        }

        /* ─── Pagination ─────────────────────────────── */
        .pagination {
            display: flex; align-items: center; justify-content: center;
            gap: 16px; padding: 24px 0 56px;
            border-top: 1px solid var(--border);
        }
        .page-info {
            color: var(--text-muted); font-size: 14px; font-weight: 500;
            min-width: 140px; text-align: center;
            font-variant-numeric: tabular-nums;
        }

        /* ─── Footer ─────────────────────────────────── */
        .app-footer {
            border-top: 1px solid var(--border);
            color: var(--text-dim); font-size: 13px;
            padding: 28px 0;
            padding-bottom: calc(28px + var(--safe-bottom));
            margin-top: 24px;
        }
        .app-footer p { margin: 0; text-align: center; }

        /* ─── Modal ──────────────────────────────────── */
        .modal {
            position: fixed; inset: 0; z-index: 100;
            display: flex; align-items: center; justify-content: center;
            padding: 24px;
        }
        .modal[hidden] { display: none; }

        .modal-backdrop {
            position: absolute; inset: 0;
            background: rgba(58, 50, 41, 0.45);
            backdrop-filter: blur(2px);
            animation: fadeIn 0.15s ease;
        }

        .modal-panel {
            position: relative;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            width: 100%;
            max-width: 720px;
            max-height: calc(100vh - 48px);
            max-height: calc(100dvh - 48px);
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 60px rgba(58, 50, 41, 0.20);
            animation: slideUp 0.2s ease;
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(12px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .modal-head {
            display: flex; align-items: flex-start; justify-content: space-between;
            gap: 16px; padding: 20px 24px 16px;
            border-bottom: 1px solid var(--border);
        }
        .modal-eyebrow {
            margin: 0 0 4px;
            font-size: 11px; font-weight: 600;
            color: var(--accent);
            text-transform: uppercase; letter-spacing: 0.1em;
        }
        .modal-title {
            margin: 0;
            font-size: 18px; font-weight: 700;
            letter-spacing: -0.01em; color: var(--text);
            word-break: break-word;
        }
        .btn-close {
            flex-shrink: 0;
            width: 34px; height: 34px;
            padding: 0;
            display: flex; align-items: center; justify-content: center;
            font-size: 22px; line-height: 1;
            background: transparent;
            color: var(--text-muted);
            border: 1px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .btn-close:hover {
            background: var(--bg-hover);
            color: var(--text);
            border-color: var(--border-strong);
        }

        .modal-body {
            padding: 22px 24px;
            overflow-y: auto;
            overscroll-behavior: contain;
            -webkit-overflow-scrolling: touch;
            color: var(--text);
            font-size: 15px;
            line-height: 1.65;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .modal-body.loading {
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            gap: 16px; min-height: 200px;
            color: var(--text-muted);
            text-align: center;
        }
        .modal-body.error { color: var(--accent-hover); }

        .spinner {
            width: 32px; height: 32px;
            border: 3px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .modal-foot {
            padding: 12px 24px 18px;
            border-top: 1px solid var(--border);
            color: var(--text-dim);
            font-size: 12px;
            text-align: right;
        }

        /* ═════════════════════════════════════════════════
           RESPONSIVE — multi-tier
           ═════════════════════════════════════════════════ */

        /* Small laptops / large tablets */
        @media (max-width: 1024px) {
            :root { --pad-x: 24px; }
            .grid { grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
        }

        /* Tablets portrait */
        @media (max-width: 768px) {
            :root { --gap: 16px; --pad-x: 20px; }
            .header-inner { padding-top: 18px; padding-bottom: 18px; }
            .brand { font-size: 22px; }
            .tagline { font-size: 13px; }
            .controls { padding: 24px 0 16px; }
            .grid { grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
            .card { padding: 18px; }
            .modal { padding: 16px; }
        }

        /* Phones (large) */
        @media (max-width: 640px) {
            body { font-size: 14px; }
            :root { --gap: 14px; --pad-x: 16px; }

            /* Header — stack, tighter */
            .header-inner {
                flex-direction: column;
                align-items: flex-start;
                gap: 4px;
                padding-top: 14px;
                padding-bottom: 14px;
            }
            .brand { font-size: 20px; }
            .tagline { font-size: 12px; }

            /* Controls — 2-col selects + full-width Refresh */
            .controls {
                flex-direction: row;
                flex-wrap: wrap;
                align-items: stretch;
                gap: 10px;
                padding: 18px 0 12px;
            }
            .control-group {
                flex: 1 1 calc(50% - 5px);
                min-width: 0;
                gap: 6px;
            }
            .control-label { font-size: 10px; letter-spacing: 0.08em; }
            .select {
                width: 100%;
                min-width: 0;
                font-size: 16px;            /* prevent iOS auto-zoom */
                padding: 12px 34px 12px 12px;
                min-height: 46px;           /* touch target */
            }
            #refreshBtn {
                flex: 1 1 100%;
                min-height: 46px;
                font-size: 14px;
            }

            /* Meta */
            .meta { font-size: 12px; padding: 2px 0 12px; }

            /* Grid — single column */
            .grid {
                grid-template-columns: 1fr;
                gap: 12px;
                padding-bottom: 24px;
            }

            /* Card — tighter on phone */
            .card { padding: 16px; gap: 12px; border-radius: 10px; }
            .card:active { transform: scale(0.995); }

            .score-badge {
                top: 12px; right: 12px;
                padding: 3px 10px;
                font-size: 11px;
            }

            .card-head { gap: 12px; }
            .avatar { width: 38px; height: 38px; border-radius: 6px; }
            .card-title-block { padding-right: 56px; }
            .card-title { font-size: 15px; }
            .card-owner { font-size: 12px; }
            .card-desc {
                font-size: 13px;
                -webkit-line-clamp: 4;
                min-height: 3.6em;
            }

            .badge { font-size: 10px; padding: 3px 9px; }

            .card-stats { gap: 12px; font-size: 11px; }
            .stat > span:first-child { font-size: 12px; }

            .card-foot { padding-top: 12px; gap: 6px; }

            .btn-ai {
                margin-left: 0;
                flex: 1 1 100%;
                padding: 10px 14px;
                font-size: 13px;
                min-height: 42px;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            /* Pagination — page info on top, buttons below */
            .pagination {
                flex-wrap: wrap;
                gap: 10px;
                padding: 18px 0 28px;
                padding-bottom: calc(28px + var(--safe-bottom));
            }
            .page-info {
                order: -1;
                min-width: 100%;
                font-size: 13px;
                padding-bottom: 4px;
            }
            .pagination .btn {
                flex: 1 1 auto;
                min-height: 46px;
                padding: 10px 14px;
                font-size: 13px;
            }

            /* Footer */
            .app-footer { font-size: 12px; padding: 20px 0; }

            /* Modal — fullscreen, safe-area aware */
            .modal { padding: 0; }
            .modal-panel {
                max-width: 100%;
                width: 100%;
                height: 100vh;
                height: 100dvh;
                max-height: 100dvh;
                border-radius: 0;
                border: none;
            }
            .modal-head {
                padding: 16px 18px 12px;
                padding-top: calc(16px + var(--safe-top));
                padding-left: calc(18px + var(--safe-left));
                padding-right: calc(18px + var(--safe-right));
            }
            .modal-eyebrow { font-size: 10px; }
            .modal-title { font-size: 16px; }
            .btn-close {
                width: 40px; height: 40px;
                font-size: 24px;
            }
            .modal-body {
                padding: 18px;
                padding-left: calc(18px + var(--safe-left));
                padding-right: calc(18px + var(--safe-right));
                font-size: 15px;
                line-height: 1.6;
            }
            .modal-foot {
                padding: 12px 18px;
                padding-bottom: calc(12px + var(--safe-bottom));
                font-size: 11px;
            }
            .spinner { width: 36px; height: 36px; }
        }

        /* Small phones */
        @media (max-width: 380px) {
            :root { --pad-x: 12px; --gap: 10px; }
            .brand { font-size: 18px; }
            .tagline { font-size: 11px; }
            .control-group { flex: 1 1 100%; }   /* stack selects */
            .card { padding: 14px; gap: 10px; }
            .score-badge { padding: 2px 8px; font-size: 10px; }
            .card-title { font-size: 14px; }
            .card-title-block { padding-right: 48px; }
            .card-desc { font-size: 12.5px; }
            .badge { font-size: 9.5px; padding: 2px 8px; }
            .card-stats { gap: 10px; font-size: 10.5px; }
            .btn-ai { font-size: 12px; padding: 9px 12px; min-height: 40px; }
            .pagination .btn { font-size: 12px; padding: 10px 10px; }
            .page-info { font-size: 12px; }
        }

        /* Touch devices — remove hover-only effects that feel wrong on tap */
        @media (hover: none) and (pointer: coarse) {
            .card:hover {
                transform: none;
                border-color: var(--border);
                box-shadow: 0 1px 2px rgba(58, 50, 41, 0.04);
            }
            .btn:hover:not(:disabled) {
                background: var(--bg-card);
                border-color: var(--border-strong);
            }
            #refreshBtn:hover:not(:disabled) { background: var(--accent); }
            .btn-ai:hover:not(:disabled) {
                background: transparent;
                color: var(--accent);
                box-shadow: none;
            }
            .btn-close:hover {
                background: transparent;
                color: var(--text-muted);
                border-color: var(--border);
            }
            /* Provide tap feedback instead */
            .card:active { border-color: var(--border-strong); }
            .btn:active:not(:disabled) { background: var(--bg-hover); }
            #refreshBtn:active:not(:disabled) { background: var(--accent-hover); }
            .btn-ai:active:not(:disabled) { background: var(--accent-tint); }
        }

        /* Landscape phone — reduce vertical chrome */
        @media (max-height: 500px) and (orientation: landscape) {
            .header-inner { padding-top: 10px; padding-bottom: 10px; }
            .brand { font-size: 18px; }
            .tagline { display: none; }
            .controls { padding: 12px 0 8px; }
            .grid { grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
        }

        /* Accessibility — respect reduced motion */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
                scroll-behavior: auto !important;
            }
        }
    </style>
</head>
<body>
<header class="app-header">
    <div class="container header-inner">
        <h1 class="brand"><span class="brand-mark">Git</span>Status</h1>
        <p class="tagline">Trending repositories, ranked daily.</p>
    </div>
</header>

<main class="container">
    <section class="controls" aria-label="Filters">
        <div class="control-group">
            <label for="categorySelect" class="control-label">Category</label>
            <select id="categorySelect" class="select">
                <option value="">All categories</option>
            </select>
        </div>

        <div class="control-group">
            <label for="pageSizeSelect" class="control-label">Per page</label>
            <select id="pageSizeSelect" class="select">
                <option value="12">12</option>
                <option value="20" selected>20</option>
                <option value="50">50</option>
            </select>
        </div>

        <button id="refreshBtn" class="btn" type="button">Refresh</button>
    </section>

    <section id="meta" class="meta" aria-live="polite"></section>
    <section id="status" class="status" aria-live="polite" hidden></section>
    <section id="grid" class="grid" aria-label="Repositories"></section>

    <nav id="pagination" class="pagination" aria-label="Pagination" hidden>
        <button id="prevBtn" class="btn" type="button">← Previous</button>
        <span id="pageInfo" class="page-info"></span>
        <button id="nextBtn" class="btn" type="button">Next →</button>
    </nav>
</main>

<footer class="app-footer">
    <div class="container">
        <p>Data from the GitHub REST API. Not affiliated with GitHub, Inc.</p>
    </div>
</footer>

<!-- AI Analysis Modal -->
<div id="aiModal" class="modal" hidden>
    <div class="modal-backdrop" data-close></div>
    <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="aiModalTitle">
        <div class="modal-head">
            <div>
                <p class="modal-eyebrow">AI Analysis · Local Model</p>
                <h3 id="aiModalTitle" class="modal-title">Repository</h3>
            </div>
            <button id="aiModalClose" class="btn-close" type="button" aria-label="Close">×</button>
        </div>
        <div id="aiModalBody" class="modal-body"></div>
        <div class="modal-foot">
            <span id="aiModalMeta"></span>
        </div>
    </div>
</div>

<script>
    'use strict';

    (() => {
        const API_BASE  = '/api/repos';
        const AI_BASE   = '/api/ai';

        const state = {
            page: 0, size: 20, category: '',
            total: 0, items: [], loading: false,
        };

        const aiCache = new Map();

        const el = {
            categorySelect: document.getElementById('categorySelect'),
            pageSizeSelect: document.getElementById('pageSizeSelect'),
            refreshBtn:    document.getElementById('refreshBtn'),
            meta:          document.getElementById('meta'),
            status:        document.getElementById('status'),
            grid:          document.getElementById('grid'),
            pagination:    document.getElementById('pagination'),
            prevBtn:       document.getElementById('prevBtn'),
            nextBtn:       document.getElementById('nextBtn'),
            pageInfo:      document.getElementById('pageInfo'),

            aiModal:       document.getElementById('aiModal'),
            aiModalTitle:  document.getElementById('aiModalTitle'),
            aiModalBody:   document.getElementById('aiModalBody'),
            aiModalMeta:   document.getElementById('aiModalMeta'),
            aiModalClose:  document.getElementById('aiModalClose'),
        };

        function formatCount(n) {
            if (n == null) return '—';
            if (n < 1000) return String(n);
            if (n < 1_000_000) return (n / 1000).toFixed(1).replace(/\.0$/, '') + 'k';
            return (n / 1_000_000).toFixed(1).replace(/\.0$/, '') + 'M';
        }

        function formatDate(iso) {
            if (!iso) return '—';
            const d = new Date(iso);
            if (Number.isNaN(d.getTime())) return '—';
            return d.toLocaleDateString(undefined, {
                year: 'numeric', month: 'short', day: 'numeric',
            });
        }

        function formatDateTime(iso) {
            if (!iso) return '';
            const d = new Date(iso);
            if (Number.isNaN(d.getTime())) return '';
            return d.toLocaleString(undefined, {
                year: 'numeric', month: 'short', day: 'numeric',
                hour: '2-digit', minute: '2-digit',
            });
        }

        function elem(tag, opts = {}) {
            const node = document.createElement(tag);
            if (opts.className) node.className = opts.className;
            if (opts.text != null) node.textContent = String(opts.text);
            if (opts.attrs) {
                for (const [k, v] of Object.entries(opts.attrs)) {
                    if (v != null) node.setAttribute(k, String(v));
                }
            }
            return node;
        }

        function setStatus(message, isError = false) {
            if (!message) {
                el.status.hidden = true;
                el.status.textContent = '';
                el.status.classList.remove('error');
                return;
            }
            el.status.hidden = false;
            el.status.textContent = message;
            el.status.classList.toggle('error', isError);
        }

        function stat(symbol, value) {
            const wrap = elem('span', { className: 'stat' });
            wrap.appendChild(elem('span', { text: symbol, attrs: { 'aria-hidden': 'true' } }));
            wrap.appendChild(elem('span', { className: 'stat-value', text: value }));
            return wrap;
        }

        function renderCard(repo) {
            const card = elem('article', { className: 'card' });

            if (typeof repo.attentionScore === 'number') {
                card.appendChild(elem('span', {
                    className: 'score-badge',
                    text: `${repo.attentionScore}`,
                    attrs: { title: 'Attention score (0–100), computed by RankingService at ingestion' },
                }));
            } else if (typeof repo.score === 'number') {
                card.appendChild(elem('span', {
                    className: 'score-badge',
                    text: formatCount(repo.score),
                    attrs: { title: 'Raw ranking score computed by RankingService' },
                }));
            }

            const head = elem('div', { className: 'card-head' });

            const avatar = elem('img', {
                className: 'avatar',
                attrs: {
                    src: repo.avatarUrl || '',
                    alt: '',
                    loading: 'lazy',
                    referrerpolicy: 'no-referrer',
                },
            });
            avatar.addEventListener('error', () => { avatar.style.visibility = 'hidden'; });
            head.appendChild(avatar);

            const titleBlock = elem('div', { className: 'card-title-block' });
            const title = elem('h2', { className: 'card-title' });
            const link = elem('a', {
                text: repo.name || repo.fullName || 'unknown',
                attrs: { href: repo.htmlUrl || '#', target: '_blank', rel: 'noopener noreferrer' },
            });
            title.appendChild(link);
            titleBlock.appendChild(title);
            titleBlock.appendChild(elem('p', {
                className: 'card-owner',
                text: repo.owner ? `@${repo.owner}` : '',
            }));
            head.appendChild(titleBlock);
            card.appendChild(head);

            card.appendChild(elem('p', {
                className: 'card-desc',
                text: repo.description || 'No description provided.',
            }));

            const stats = elem('div', { className: 'card-stats' });
            stats.appendChild(stat('★', formatCount(repo.stars)));
            stats.appendChild(stat('⑂', formatCount(repo.forks)));
            stats.appendChild(stat('◎', formatCount(repo.issues)));
            stats.appendChild(stat('⟳', formatDate(repo.updatedAt)));
            card.appendChild(stats);

            const foot = elem('div', { className: 'card-foot' });
            if (repo.category) {
                foot.appendChild(elem('span', { className: 'badge category', text: repo.category }));
            }
            if (repo.language) {
                foot.appendChild(elem('span', { className: 'badge', text: repo.language }));
            }
            if (typeof repo.score === 'number') {
                foot.appendChild(elem('span', {
                    className: 'badge',
                    text: `raw ${formatCount(repo.score)}`,
                    attrs: { title: 'Weighted score from RankingService' },
                }));
            }

            const aiBtn = elem('button', {
                className: 'btn btn-ai',
                text: '✦ Explain',
                attrs: { type: 'button', title: 'Generate an AI summary of this repository' },
            });
            aiBtn.addEventListener('click', () => {
                openAiAnalysis(
                    repo.githubId,
                    repo.fullName || repo.name || 'Repository'
                );
            });
            foot.appendChild(aiBtn);

            card.appendChild(foot);
            return card;
        }

        function renderGrid(items) {
            el.grid.replaceChildren();
            if (!items.length) {
                setStatus('No repositories match the current filters.');
                return;
            }
            setStatus('');
            const frag = document.createDocumentFragment();
            for (const repo of items) frag.appendChild(renderCard(repo));
            el.grid.appendChild(frag);
        }

        function renderMeta(total) {
            if (!total) { el.meta.textContent = ''; return; }
            const start = state.page * state.size + 1;
            const end = Math.min(start + state.items.length - 1, total);
            el.meta.textContent = `Showing ${start}–${end} of ${total} repositories`;
        }

        function renderPagination(total) {
            const totalPages = Math.max(1, Math.ceil(total / state.size));
            if (totalPages <= 1) { el.pagination.hidden = true; return; }
            el.pagination.hidden = false;
            el.pageInfo.textContent = `Page ${state.page + 1} of ${totalPages}`;
            el.prevBtn.disabled = state.page === 0;
            el.nextBtn.disabled = state.page + 1 >= totalPages;
        }

        function setModalState(state_) {
            el.aiModalBody.classList.remove('loading', 'error');
            el.aiModalBody.replaceChildren();
            if (state_ === 'loading' || state_ === 'error') {
                el.aiModalBody.classList.add(state_);
            }
        }

        function renderLoading() {
            setModalState('loading');
            el.aiModalBody.appendChild(elem('div', { className: 'spinner' }));
            el.aiModalBody.appendChild(elem('p', {
                text: 'Generating analysis with the local model… this may take up to a minute.',
            }));
            el.aiModalMeta.textContent = '';
        }

        function renderError(message) {
            setModalState('error');
            el.aiModalBody.appendChild(elem('p', { text: message }));
            el.aiModalMeta.textContent = '';
        }

        function renderAnalysis(text, generatedAt, fromCache) {
            setModalState('default');
            el.aiModalBody.textContent = text || '(empty response)';
            const when = generatedAt ? formatDateTime(generatedAt) : '';
            el.aiModalMeta.textContent =
                (fromCache ? 'Loaded from cache · ' : 'Generated · ') +
                (when ? when : 'just now');
        }

        function openModal(title) {
            el.aiModalTitle.textContent = title;
            el.aiModal.hidden = false;
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            el.aiModal.hidden = true;
            document.body.style.overflow = '';
            setModalState('default');
        }

        async function openAiAnalysis(githubId, fullName) {
            openModal(fullName);

            if (aiCache.has(githubId)) {
                const hit = aiCache.get(githubId);
                renderAnalysis(hit.text, hit.generatedAt, true);
                return;
            }

            renderLoading();

            try {
                const res = await fetch(`${AI_BASE}/explain/${githubId}`, {
                    headers: { Accept: 'application/json' },
                });

                if (!res.ok) {
                    if (res.status === 500) {
                        renderError(
                            'The AI service could not produce an analysis for this repository. ' +
                            'This usually means the README is not cached yet. ' +
                            'Try refreshing the page or running the README cache first.'
                        );
                    } else if (res.status === 404) {
                        renderError('This repository was not found.');
                    } else {
                        renderError(`AI request failed (${res.status}).`);
                    }
                    return;
                }

                const data = await res.json();

                const text = typeof data.repositoryExplainer === 'string'
                    ? data.repositoryExplainer
                    : '';

                if (!text) {
                    renderError('The AI returned an empty response.');
                    return;
                }

                aiCache.set(githubId, { text, generatedAt: data.generatedAt || null });
                renderAnalysis(text, data.generatedAt || null, false);
            } catch (err) {
                console.error(err);
                renderError('Network error. Is the backend running?');
            }
        }

        el.aiModalClose.addEventListener('click', closeModal);
        el.aiModal.querySelector('.modal-backdrop')
            .addEventListener('click', closeModal);
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && !el.aiModal.hidden) closeModal();
        });

        async function loadCategories() {
            try {
                const res = await fetch(`${API_BASE}/categories`, {
                    headers: { Accept: 'application/json' },
                });
                if (!res.ok) return;
                const cats = await res.json();
                const current = el.categorySelect.value;
                for (const c of cats) {
                    el.categorySelect.appendChild(
                        elem('option', { text: c, attrs: { value: c } })
                    );
                }
                el.categorySelect.value = current;
            } catch (err) {
                console.warn('Failed to load categories', err);
            }
        }

        async function loadRepos() {
            if (state.loading) return;
            state.loading = true;

            el.prevBtn.disabled = true;
            el.nextBtn.disabled = true;

            setStatus('Loading…');

            const params = new URLSearchParams({
                page: String(state.page),
                size: String(state.size),
            });
            const base = state.category
                ? `${API_BASE}/category/${encodeURIComponent(state.category)}`
                : API_BASE;

            try {
                const res = await fetch(`${base}?${params}`, {
                    headers: { Accept: 'application/json' },
                });

                if (!res.ok) {
                    let detail = `Request failed (${res.status})`;
                    try {
                        const problem = await res.json();
                        if (problem && problem.detail) detail = problem.detail;
                    } catch { /* not JSON */ }
                    state.items = []; state.total = 0;
                    renderGrid([]); renderMeta(0);
                    setStatus(detail, true);
                    return;
                }

                const body = await res.json();
                state.items = Array.isArray(body.items) ? body.items : [];
                state.total = Number(body.total) || 0;

                renderGrid(state.items);
                renderMeta(state.total);
            } catch (err) {
                state.items = []; state.total = 0;
                renderGrid([]); renderMeta(0);
                setStatus('Network error. Is the backend running?', true);
                console.error(err);
            } finally {
                state.loading = false;
                renderPagination(state.total);
            }
        }

        el.categorySelect.addEventListener('change', () => {
            state.category = el.categorySelect.value;
            state.page = 0;
            loadRepos();
        });

        el.pageSizeSelect.addEventListener('change', () => {
            state.size = Number(el.pageSizeSelect.value) || 20;
            state.page = 0;
            loadRepos();
        });

        el.refreshBtn.addEventListener('click', () => {
            loadCategories();
            loadRepos();
        });

        el.prevBtn.addEventListener('click', () => {
            if (state.loading) return;
            if (state.page > 0) {
                state.page -= 1;
                loadRepos();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        });

        el.nextBtn.addEventListener('click', () => {
            if (state.loading) return;
            const totalPages = Math.max(1, Math.ceil(state.total / state.size));
            if (state.page + 1 < totalPages) {
                state.page += 1;
                loadRepos();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        });

        loadCategories();
        loadRepos();
    })();
</script>
</body>
</html>
